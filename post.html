<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | Blog AgroTech</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=3">
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png?v=3">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon-512x512.png?v=3">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=3">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#4CAF50">

    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">

    <style>
        .article-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .article-header {
            padding: 160px 0 80px;
            text-align: center;
            background: radial-gradient(circle at center, rgba(76, 175, 80, 0.15) 0%, transparent 70%);
        }

        .article-meta {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: var(--spacing-md);
            display: block;
            font-weight: 500;
        }

        .article-content {
            background: var(--dark-card);
            padding: var(--spacing-xl);
            /* 5rem padding */
            border-radius: var(--radius-lg);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            line-height: 1.9;
            font-size: 1.15rem;
            /* Larger font for readability */
            color: rgba(255, 255, 255, 0.95);
        }

        /* Typography inside articles */
        .article-content h2 {
            color: var(--brand-green);
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-sm);
            font-size: 2rem;
        }

        .article-content h3 {
            color: var(--brand-orange);
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-sm);
            font-size: 1.5rem;
        }

        .article-content p {
            margin-bottom: var(--spacing-md);
            color: var(--text-secondary);
            max-width: 800px;
            /* Keep text lines from getting too long for reading comfort */
            margin-left: auto;
            margin-right: auto;
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: var(--spacing-md);
            padding-left: var(--spacing-lg);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .article-content li {
            margin-bottom: var(--spacing-xs);
            color: var(--text-secondary);
        }

        /* Highlighting intro */
        .article-content .blog-intro {
            font-size: 1.35rem;
            color: var(--text-primary);
            font-weight: 500;
            border-left: 4px solid var(--brand-green);
            padding-left: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .article-content {
                padding: var(--spacing-md);
            }

            .article-header {
                padding: 120px 0 40px;
            }

            .article-content h2 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="container">
            <nav class="nav">
                <a href="index.html" class="nav-logo">
                    <img src="images/agrotech solo blanco.png" alt="Agrotech Digital" class="nav-logo-image">
                    <span>agrotech.</span>
                </a>
                <ul class="nav-links" id="navLinks">
                    <li><a href="blog.html">← Volver al Blog</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Article Header -->
    <section class="section article-header">
        <div class="container article-container">
            <span class="section-badge">Blog AgroTech</span>
            <h1 id="post-title">Cargando artículo...</h1>
            <div id="post-meta" class="article-meta"></div>
        </div>
    </section>

    <!-- Article Content -->
    <section class="section" style="padding-top: 0;">
        <div class="container article-container">
            <div id="post-content" class="article-content reveal active">
                <div class="loading-spinner" style="margin: 0 auto;"></div>
            </div>

            <!-- Related Posts Section -->
            <div
                style="margin-top: var(--spacing-xl); border-top: 1px solid rgba(255,255,255,0.1); padding-top: var(--spacing-lg);">
                <h3 style="margin-bottom: var(--spacing-md); color: var(--text-primary);">También le puede interesar
                </h3>
                <div id="related-posts-grid"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--spacing-md);">
                    <!-- JS will load related posts here -->
                </div>
            </div>

            <div style="margin-top: var(--spacing-xl); text-align: center;">
                <a href="blog.html" class="neuro-button neuro-button-primary">Volver al Blog</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy;
                    <script>document.write(new Date().getFullYear())</script> Agrotech Digital.
                </p>
            </div>
        </div>
    </footer>

    <!-- JS -->
    <script src="js/blog.js"></script>
</body>

</html>
