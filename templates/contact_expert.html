<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | AgroTech Colombia</title>
    <meta name="description"
        content="Contáctenos para recibir asesoría sobre el análisis histórico de sus cultivos.">
    <meta name="author" content="AgroTech Colombia">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/landing.css">
    <style>
        /* Specific styles for this separate page */
        .form-page-body {
            background-image: url('../images/agrotech satelite 1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .form-page-body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.9);
            z-index: 1;
        }

        .form-card {
            background: var(--dark-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 2;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: var(--spacing-sm);
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--brand-green);
            background: rgba(255, 255, 255, 0.1);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--brand-green);
        }
    </style>
</head>

<body class="form-page-body">

    <div class="form-card fade-in-up">
        <a href="../index.html" class="back-link">
            ← Volver al Inicio
        </a>

        <div class="text-center mb-3">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Cuéntenos sobre su terreno</h1>
            <p>Déjenos sus datos y lo contactamos pronto.</p>
        </div>

        <form name="contact-expert" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/templates/gracias.html">
            <input type="hidden" name="form-name" value="contact-expert">
            <p style="display:none"><label>No llenar: <input name="bot-field"></label></p>

            <div class="form-group">
                <label class="form-label" for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" class="form-input" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="juan@ejemplo.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="telefono">Teléfono / WhatsApp</label>
                <input type="tel" id="telefono" name="telefono" class="form-input" required
                    placeholder="+57 300 123 4567">
            </div>

            <div class="form-group">
                <label class="form-label" for="tipo_lote">¿Qué tipo de lote tiene?</label>
                <select id="tipo_lote" name="tipo_lote" class="form-select" required>
                    <option value="" disabled selected>Seleccione una opción...</option>
                    <option value="Lote Nuevo / Por comprar">Voy a comprar o arrendar (Lote Nuevo)</option>
                    <option value="Cultivo Establecido">Ya tengo cultivo sembrado</option>
                    <option value="Planeacion">Voy a sembrar pronto</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="mensaje">¿Qué necesita saber de su terreno?</label>
                <textarea id="mensaje" name="mensaje" class="form-textarea" rows="4"
                    placeholder="Ej: Quiero saber si se inunda mucho antes de sembrar arroz..."></textarea>
            </div>

            <button type="submit" class="neuro-button neuro-button-primary" style="width: 100%; margin-top: 1rem;">
                Enviar Solicitud
            </button>
            <p class="text-center" style="font-size: 0.8rem; margin-top: 1rem; color: var(--text-secondary);">
                Sus datos están protegidos. Revise nuestra <a href="../legal/privacidad.html" style="color: var(--brand-green);">Política de Privacidad</a>.
            </p>
        </form>
    </div>

</body>

</html>
