<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mensaje Enviado! | AgroTech Colombia</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/landing.css">
    <style>
        .thankyou-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .thankyou-card {
            background: var(--dark-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 550px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .thankyou-icon { font-size: 4rem; margin-bottom: var(--spacing-md); }
        .thankyou-card h1 { font-size: 1.8rem; margin-bottom: var(--spacing-sm); color: var(--text-primary); }
        .thankyou-card p { color: var(--text-secondary); line-height: 1.7; margin-bottom: var(--spacing-md); }
    </style>
</head>

<body>
    <div class="thankyou-page">
        <div class="thankyou-card fade-in-up">
            <div class="thankyou-icon">✅</div>
            <h1>¡Mensaje recibido!</h1>
            <p>Gracias por contactarnos. Revisaremos su solicitud y lo contactaremos pronto por WhatsApp o correo electrónico.</p>
            <p style="color: var(--brand-green); font-weight: 600;">Tiempo promedio de respuesta: menos de 24 horas</p>
            <a href="../index.html" class="neuro-button neuro-button-primary" style="margin-top: var(--spacing-md);">
                Volver al Inicio
            </a>
        </div>
    </div>
</body>

</html>
